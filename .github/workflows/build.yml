name: Build Ronda

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: python3 scripts/check-release.py
      - run: python3 scripts/test_release.py
      - run: bun run check
      - run: bun run site:build
      - run: bun run prepare:sidecars
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify installed-app smoke fixture
        run: python3 scripts/resume-smoke.py --self-check --output "$RUNNER_TEMP/resume-smoke-self-check"

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2t64 xdg-utils
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Build release CLI and MCP sidecars
        run: bun run prepare:sidecars:release
      - name: Verify prepared sidecars
        shell: bash
        run: |
          extension=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then extension=".exe"; fi
          test -s "src-tauri/binaries/ronda-cli-${CARGO_BUILD_TARGET}${extension}"
          test -s "src-tauri/binaries/ronda-mcp-${CARGO_BUILD_TARGET}${extension}"
      - name: Check resume readiness on the packaging platform
        run: cargo test -p ronda --lib resume::tests
      # Signs and notarizes with a Developer ID when the Apple secrets are configured; otherwise the app is ad-hoc signed.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::$name is required when APPLE_CERTIFICATE is set"; exit 1; }
            echo "::add-mask::${!name}"
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Build installer
        run: bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci --verbose
      - name: Verify DMG contains both sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=("target/${CARGO_BUILD_TARGET}/release/bundle/dmg/"*.dmg)
          test "${#images[@]}" -eq 1
          mount_dir="$(mktemp -d "$RUNNER_TEMP/ronda-dmg.XXXXXX")"
          # bundle.licenseFile puts the AGPL in the DMG as a software license agreement,
          # so hdiutil prints it and waits for an answer, cancelling the attach on EOF.
          echo Y | hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir"' EXIT
          find "$mount_dir" -type f -name ronda-cli -print -quit | grep -q .
          find "$mount_dir" -type f -name ronda-mcp -print -quit | grep -q .
      - name: Verify deb and AppImage contain both sidecars
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          debs=("target/${CARGO_BUILD_TARGET}/release/bundle/deb/"*.deb)
          images=("target/${CARGO_BUILD_TARGET}/release/bundle/appimage/"*.AppImage)
          test "${#debs[@]}" -eq 1
          test "${#images[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/ronda-deb" "$RUNNER_TEMP/ronda-appimage"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/ronda-deb"
          find "$RUNNER_TEMP/ronda-deb" -type f -name ronda-cli -print -quit | grep -q .
          find "$RUNNER_TEMP/ronda-deb" -type f -name ronda-mcp -print -quit | grep -q .
          image="$GITHUB_WORKSPACE/${images[0]}"
          chmod +x "$image"
          cd "$RUNNER_TEMP/ronda-appimage"
          "$image" --appimage-extract >/dev/null
          find squashfs-root -type f -name ronda-cli -print -quit | grep -q .
          find squashfs-root -type f -name ronda-mcp -print -quit | grep -q .
      - name: Verify NSIS contains both sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/$env:CARGO_BUILD_TARGET/release/bundle/nsis/*.exe"
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer" }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "7-Zip is missing from the Windows runner" }
          $extract = Join-Path $env:RUNNER_TEMP 'ronda-nsis'
          New-Item -ItemType Directory -Force $extract | Out-Null
          & $sevenZip x -y "-o$extract" $installer.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract NSIS installer" }
          if (-not (Get-ChildItem $extract -Recurse -File -Filter 'ronda-cli.exe')) { throw "ronda-cli.exe is missing from NSIS" }
          if (-not (Get-ChildItem $extract -Recurse -File -Filter 'ronda-mcp.exe')) { throw "ronda-mcp.exe is missing from NSIS" }
      - uses: actions/upload-artifact@v4
        with:
          name: ronda-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

  installed-resume:
    needs: bundle
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installed-resume-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ronda-${{ matrix.target }}
          path: smoke-installers
      - name: Install Linux package and native test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb xterm xdotool openbox dbus-x11
          packages=(smoke-installers/deb/*.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get install -y "./${packages[0]}"
          echo "RONDA_SMOKE_APP=$(command -v ronda)" >> "$GITHUB_ENV"
      - name: Install Windows package and matching native driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem smoke-installers -Recurse -File -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'ronda-installed-smoke'
          $process = Start-Process $installer[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $binary = @(Get-ChildItem $destination -Recurse -File -Filter 'ronda.exe')
          if ($binary.Count -ne 1) { throw 'Expected one installed Ronda executable' }
          "RONDA_SMOKE_APP=$($binary[0].FullName)" >> $env:GITHUB_ENV
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native driver tool installation failed' }
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Matching Edge driver download failed' }
          $PWD.Path >> $env:GITHUB_PATH
      - name: Install Tauri native WebDriver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify installed Linux resume flows
        if: runner.os == 'Linux'
        shell: bash
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' sh -c '
            openbox > "$RUNNER_TEMP/ronda-window-manager.log" 2>&1 &
            manager=$!
            trap "kill $manager" EXIT
            python3 scripts/resume-smoke.py --app "$RONDA_SMOKE_APP"
          '
      - name: Verify installed Windows resume flows
        if: runner.os == 'Windows'
        run: python scripts/resume-smoke.py --app "$env:RONDA_SMOKE_APP"
      - name: Save native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-smoke-${{ matrix.target }}
          if-no-files-found: error
          path: resume-smoke-evidence/

  # Tag pushes (v1.2.3) publish a GitHub release. Assets get version-free names so
  # https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/<name> always points at the newest build.
  release:
    needs: [bundle, installed-resume]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${version}"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [${version}] section"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir release
          take() {
            mapfile -t matches < <(find "bundles/ronda-$1" -type f -name "$2")
            test "${#matches[@]}" -eq 1 || { echo "::error::expected one $2 in ronda-$1, found ${#matches[@]}"; exit 1; }
            cp "${matches[0]}" "release/$3"
          }
          take aarch64-apple-darwin '*.dmg' Ronda-macos-arm64.dmg
          take x86_64-apple-darwin '*.dmg' Ronda-macos-x64.dmg
          take x86_64-pc-windows-msvc '*-setup.exe' Ronda-windows-x64-setup.exe
          take x86_64-unknown-linux-gnu '*.deb' Ronda-linux-amd64.deb
          take aarch64-unknown-linux-gnu '*.deb' Ronda-linux-arm64.deb
          take x86_64-unknown-linux-gnu '*.AppImage' Ronda-linux-x86_64.AppImage
          take aarch64-unknown-linux-gnu '*.AppImage' Ronda-linux-aarch64.AppImage
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            printf 'Source commit: `%s`\n\n' "$(git rev-parse HEAD)"
            awk -v heading="## [${version}]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md
            cat <<NOTES

          ## Install

          | Platform | Download |
          | --- | --- |
          | macOS, Apple silicon | [Ronda-macos-arm64.dmg](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-macos-arm64.dmg) |
          | macOS, Intel | [Ronda-macos-x64.dmg](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-macos-x64.dmg) |
          | Windows x64 | [Ronda-windows-x64-setup.exe](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-windows-x64-setup.exe) |
          | Debian / Ubuntu | [amd64](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-linux-amd64.deb) · [arm64](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-linux-arm64.deb) |
          | Linux AppImage | [x86_64](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-linux-x86_64.AppImage) · [aarch64](https://github.com/tryronda/ronda/releases/download/${GITHUB_REF_NAME}/Ronda-linux-aarch64.AppImage) |

          First launch, security prompts, and checksums: https://tryronda.cloud/docs/#install
          NOTES
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py "$GITHUB_REF_NAME" release notes.md "$(git rev-parse HEAD)"
      # Repository dispatch runs the site workflow on main, the ref permitted by
      # the github-pages environment. That workflow checks out the published tag.
      - name: Request published site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=publish-release-site -f "client_payload[ref]=$GITHUB_REF_NAME"
