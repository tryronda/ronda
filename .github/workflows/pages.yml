name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "CHANGELOG.md"
      - "vite.site.config.ts"
      - "scripts/prerender-site.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/configure-pages@v5
      # The site is served from the tryronda.cloud custom domain (site/public/CNAME), so it builds at the root path.
      - name: Build site
        env:
          SITE_BASE: /
          SITE_URL: https://tryronda.cloud/
        run: bun run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
