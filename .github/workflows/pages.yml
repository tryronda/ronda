name: Deploy site

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Published release tag to deploy
        type: string
        required: true
  repository_dispatch:
    types: [publish-release-site]


permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # configure-pages reads the Pages site settings, which needs pages: read.
    # Job-level permissions replace the top-level block, so contents: read is repeated.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.client_payload.ref }}
      - name: Verify published source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref || github.event.client_payload.ref }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release view "$RELEASE_TAG" --json body --jq .body | grep -F "Source commit: \`$(git rev-parse HEAD)\`"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/configure-pages@v5
      # The site is served from the tryronda.cloud custom domain (site/public/CNAME), so it builds at the root path.
      - name: Build site
        env:
          SITE_BASE: /
          SITE_URL: https://tryronda.cloud/
        run: bun run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
