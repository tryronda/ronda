[workspace]
resolver = "2"
members = ["crates/ronda-core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "AGPL-3.0-only"
repository = "https://github.com/tryronda/ronda"
homepage = "https://tryronda.cloud"
authors = ["Ronda contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
